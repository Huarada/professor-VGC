<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-label="Container diagram: Streamlit UI calls the Python application core, which talks to a Node calc-engine subprocess, an optional Node Smogon-dex subprocess, Google Cloud Firestore for Chaos data, an in-process conversation memory, and BYOK LLM provider APIs; the dex subprocess in turn reaches the optional Smogon official host. The whole boundary runs as one container on Cloud Run in production.">
  <style>
    text{font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;}
    .box{fill:#FFFFFF;stroke:#1B2229;stroke-width:1.4;}
    .box.det{stroke:#0F7A72;} .box.prob{stroke:#A8660A;}
    .box.orch{stroke:#6E4FA3;} .box.neutral{stroke:#56606A;}
    .box.ext{stroke-dasharray:5 3;} .box.emph{stroke-width:2.4;}
    .fill-det{fill:#E4F1EE;} .fill-prob{fill:#F5EBDA;} .fill-orch{fill:#EDE7F5;}
    .t-tag{font-family:ui-monospace,"Cascadia Code","SFMono-Regular",Consolas,monospace;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;fill:#56606A;}
    .t-title{font-size:14px;font-weight:700;fill:#1B2229;}
    .t-desc{font-size:10.6px;fill:#56606A;}
    .t-label{font-size:10.6px;fill:#1B2229;}
    .arrow{fill:none;stroke:#56606A;stroke-width:1.3;}
    .boundary{fill:none;stroke:#56606A;stroke-width:1.2;stroke-dasharray:6 4;}
    .boundary-label{font-family:ui-monospace,"Cascadia Code","SFMono-Regular",Consolas,monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;fill:#56606A;}
  </style>
  <rect x="0" y="0" width="1000" height="660" fill="#FFFFFF"/>

  <defs>
    <marker id="b-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#56606A"/>
    </marker>
  </defs>

  <rect class="boundary" x="20" y="20" width="700" height="580" rx="12"/>
  <text class="boundary-label" x="36" y="44">ProfessorVGC — this repo (deployed as one container on Cloud Run)</text>

  <!-- UI -->
  <rect class="box neutral" x="50" y="66" width="270" height="86" rx="8"/>
  <text class="t-tag" x="66" y="88">[Container · Python / Streamlit]</text>
  <text class="t-title" x="66" y="110">Streamlit UI</text>
  <text class="t-desc" x="66" y="130">src/ui/app.py — pure view,</text>
  <text class="t-desc" x="66" y="143">renders the AnalysisResult DTO</text>

  <!-- Application core -->
  <rect class="box det emph fill-det" x="50" y="190" width="620" height="106" rx="8"/>
  <text class="t-tag" x="66" y="212">[Container · Python]</text>
  <text class="t-title" x="66" y="234">Application Core</text>
  <text class="t-desc" x="66" y="254">src/domain + src/services + src/adapters</text>
  <text class="t-desc" x="66" y="267">three interchangeable AnalysisPipeline backends (ADK default), one DI root</text>

  <!-- Calc engine subprocess -->
  <rect class="box det fill-det" x="50" y="336" width="290" height="90" rx="8"/>
  <text class="t-tag" x="66" y="358">[Container · Node.js subprocess]</text>
  <text class="t-title" x="66" y="380">Calc Engine</text>
  <text class="t-desc" x="66" y="400">node_calc/calc_server.js</text>
  <text class="t-desc" x="66" y="413">wraps @smogon/calc</text>

  <!-- Smogon dex subprocess -->
  <rect class="box prob fill-prob" x="380" y="336" width="290" height="90" rx="8"/>
  <text class="t-tag" x="396" y="358">[Container · Node.js subprocess, optional]</text>
  <text class="t-title" x="396" y="380">Smogon Dex Worker</text>
  <text class="t-desc" x="396" y="400">node_calc/smogon_dex_server.js</text>
  <text class="t-desc" x="396" y="413">wraps @pkmn/smogon</text>

  <!-- conversation memory -->
  <rect class="box neutral" x="50" y="456" width="290" height="80" rx="8"/>
  <text class="t-tag" x="66" y="478">[Container · in-process store]</text>
  <text class="t-title" x="66" y="500">Conversation Memory</text>
  <text class="t-desc" x="66" y="520">per-session ChatMessage history</text>

  <!-- External: Chaos data via Firestore -->
  <rect class="box prob fill-prob" x="770" y="66" width="210" height="86" rx="8"/>
  <text class="t-tag" x="786" y="88">[External · Google Cloud]</text>
  <text class="t-title" x="786" y="110">Chaos stats (Firestore)</text>
  <text class="t-desc" x="786" y="130">chaos_tiers collection</text>

  <!-- External: LLM provider -->
  <rect class="box orch fill-orch" x="770" y="190" width="210" height="86" rx="8"/>
  <text class="t-tag" x="786" y="212">[External · BYOK]</text>
  <text class="t-title" x="786" y="234">LLM Provider APIs</text>
  <text class="t-desc" x="786" y="254">OpenAI / Gemini</text>

  <!-- External: Smogon host -->
  <rect class="box prob ext fill-prob" x="770" y="336" width="210" height="90" rx="8"/>
  <text class="t-tag" x="786" y="358">[External, optional]</text>
  <text class="t-title" x="786" y="380">Smogon official host</text>
  <text class="t-desc" x="786" y="400">data.pkmn.cc</text>

  <!-- arrows -->
  <path class="arrow" d="M185,152 L185,188" marker-end="url(#b-arrow)"/>
  <text class="t-label" x="192" y="175">analyze(request) → AnalysisResult</text>

  <path class="arrow" d="M220,296 L220,334" marker-end="url(#b-arrow)"/>
  <text class="t-label" x="228" y="320">stdio JSON: calculate,</text>
  <text class="t-label" x="228" y="333">compareSpeed, formeResolves</text>

  <path class="arrow" d="M500,296 L500,334" marker-end="url(#b-arrow)"/>
  <text class="t-label" x="507" y="320">stdio JSON: analyses,</text>
  <text class="t-label" x="507" y="333">sets, stats</text>

  <path class="arrow" d="M195,296 L195,454" marker-end="url(#b-arrow)"/>
  <text class="t-label" x="345" y="450">load / append(session_id)</text>

  <path class="arrow" d="M670,220 L768,110" marker-end="url(#b-arrow)"/>
  <text class="t-label" x="672" y="170">Firestore client: query by species+tier</text>

  <path class="arrow" d="M670,240 L768,233" marker-end="url(#b-arrow)"/>
  <text class="t-label" x="672" y="222">BYOK API calls</text>

  <path class="arrow" d="M670,395 C710,395 730,395 768,390" marker-end="url(#b-arrow)"/>
  <text class="t-label" x="672" y="440">HTTPS fetch → {ok:false,error}</text>
  <text class="t-label" x="672" y="453">on failure — never crashes the pipeline</text>
</svg>
