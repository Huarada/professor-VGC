name: CI

# Runs on every PR (against any branch) and on every push to master, so the
# same green/red signal a reviewer sees on a PR also tracks master itself.
on:
  pull_request:
  push:
    branches: [master]

# Least privilege for the workflow token: CI only reads the repository.
permissions:
  contents: read

# A newer push to the same PR/branch supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python floor (pyproject.toml) + the current stable line.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Real Node available -> the calc-engine integration tests
      # (test_calc_engine_*.py) exercise the actual @smogon/calc subprocess
      # instead of skipping (see their own pytest.skip fallback for
      # environments without Node — this CI job intentionally isn't one).
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: node_calc/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm install
        working-directory: node_calc

      - name: Node calc engine smoke test
        run: npm run smoke
        working-directory: node_calc

      - name: Node unit tests (node --test, no framework dependency)
        run: npm test
        working-directory: node_calc

      - name: pytest
        run: pytest -q

  lint:
    name: lint (ruff + dead code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install ruff vulture

      - name: ruff (pyflakes rules)
        run: ruff check src scripts tests --select F

      - name: vulture (dead code)
        run: vulture src vulture_whitelist.py --min-confidence 80

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: mypy --strict
        run: mypy src
